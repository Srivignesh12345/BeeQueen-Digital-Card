<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Bee Queen Blog</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="admin-login-overlay" id="loginOverlay">
    <div class="admin-login-card">
      <img src="/templates/logo.jpg" alt="Bee Queen Logo" class="hero-logo" />
      <h2>Admin Access</h2>
      <p class="subtitle">Bee Queen Blog Panel</p>
      <div class="form-group" style="margin-top:24px;">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="Enter admin password" />
      </div>
      <p class="login-error" id="loginError"></p>
      <button class="submit-btn" onclick="adminLogin()">
        <i class="fas fa-lock-open"></i> &nbsp;Login
      </button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="adminPanel" style="display:none;">

    <div class="admin-header">
      <div>
        <h2>📝 Blog Manager</h2>
        <p class="subtitle">Post new content for Bee Queen</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <a href="blog.html" target="_blank" class="cta call" style="padding:10px 20px;font-size:14px;">
          <i class="fas fa-eye"></i> View Blog
        </a>
        <button class="submit-btn" style="width:auto;padding:10px 20px;font-size:14px;" onclick="adminLogout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- NEW POST FORM -->
    <div class="admin-form-card">
      <h3 class="form-section-title">✨ Create New Post</h3>

      <div class="form-group">
        <label>Post Title</label>
        <input type="text" id="postTitle" placeholder="e.g. How to care for your silk saree" />
      </div>

      <div class="form-group">
        <label>Upload Image or Video</label>
        <div class="media-upload-box" id="mediaUploadBox" onclick="document.getElementById('mediaFile').click()">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Click to upload image or video</p>
          <span>JPG, PNG, GIF, MP4, MOV supported</span>
          <input type="file" id="mediaFile" accept="image/*,video/*" style="display:none;" onchange="previewMedia(this)" />
        </div>
        <div id="mediaPreview" style="display:none;margin-top:14px;text-align:center;"></div>
      </div>

      <div class="form-group">
        <label>Content / Caption</label>
        <textarea id="postContent" placeholder="Write the context or description for this post..." rows="5"></textarea>
      </div>

      <button class="submit-btn" onclick="publishPost()">
        <i class="fas fa-paper-plane"></i> &nbsp;Publish Post
      </button>
      <p class="form-status" id="publishStatus"></p>
    </div>

    <!-- EXISTING POSTS -->
    <div class="admin-posts-section">
      <h3 class="form-section-title">📋 Published Posts</h3>
      <div id="adminPostList"></div>
      <p class="no-posts" id="adminNoPosts" style="display:none;">No posts yet.</p>
    </div>

  </div>

  <script type="module" src="blog.js"></script>
</body>
</html>
